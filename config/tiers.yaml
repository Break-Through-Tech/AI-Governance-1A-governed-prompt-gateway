# Model tiers and routing rules for the Governed Prompt Gateway.
#
# Prices are USD per one million tokens. Bump `version` whenever a price or a
# rule changes, so every decision record can be traced back to the table that
# produced its numbers. Verify prices against the provider's pricing page.
version: "2026-10-05"
currency: USD

tiers:
  tier-1:
    model: gemini-2.5-flash-lite
    input_per_million: 0.10
    output_per_million: 0.40
    description: Cheap and fast. Single-step FAQ questions.
  tier-2:
    model: gemini-2.5-flash
    input_per_million: 0.30
    output_per_million: 2.50
    description: Stronger reasoning. Multi-step, numeric, or escalated questions.

routing:
  default_tier: tier-1
  baseline_tier: tier-2       # "what if every query went to the expensive model"
  escalation_tier: tier-2     # where ESCALATE verdicts and complex queries go
  expected_output_tokens: 120 # assumed reply length for estimates made before the call
  long_query_tokens: 120      # a query longer than this is one complexity signal
  complexity_threshold: 2     # this many signals bumps a query to the escalation tier
  intent_tiers:               # intents that always need a specific tier
    disputed_charge: tier-2
    loan_application: tier-2
    investment_question: tier-2
    fraud_report: tier-2
